<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda - Suplementos e Inventario</title>
    <style>
        :root { --bg: #0b0c10; --card: #18181b; --gold: #fbbf24; --text: #f4f4f5; --border: #27272a; }
        body { margin:0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        header { border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        h1 { color: var(--gold); margin: 0; font-size: 24px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid var(--border); padding: 12px; text-align: left; }
        th { background: var(--card); color: var(--gold); }
        input, button { padding: 10px; border-radius: 6px; box-sizing: border-box; }
        input { background: #000; border: 1px solid var(--border); color: #fff; width: 60%; }
        button { background: var(--gold); border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>🛍️ Sistema #5: Suplementos e Inventario</h1>
    </header>
    <div>
        <input type="text" id="barcode" placeholder="Escanear Código de Barras o ID producto...">
        <button onclick="buscar()">Buscar Stock</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Producto</th>
                <th>Stock</th>
                <th>Precio</th>
            </tr>
        </thead>
        <tbody id="tabla">
            <tr>
                <td>77912345</td>
                <td>Whey Protein Isolate 1kg</td>
                <td>24 unidades</td>
                <td>$42.000</td>
            </tr>
            <tr>
                <td>77998765</td>
                <td>Creatina Monohidratada 300g</td>
                <td>15 unidades</td>
                <td>$38.000</td>
            </tr>
        </tbody>
    </table>
    <script>
        function buscar() {
            let code = document.getElementById('barcode').value;
            if(code) alert('Buscando producto con código: ' + code);
        }
    </script>
</body>
</html>

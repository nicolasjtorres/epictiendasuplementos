<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epic Nutrition Store ARS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-black text-amber-500">EPIC<span class="text-white">STORE</span></h1>
      <button onclick="toggleCart()" class="relative p-2 text-slate-300 hover:text-amber-500 transition">
        <i class="fa-solid fa-cart-shopping text-xl"></i>
        <span id="cartBadge" class="absolute -top-1 -right-1 bg-amber-500 text-slate-950 text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center">0</span>
      </button>
    </div>
  </header>

  <!-- Catálogo de Productos -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
    <div class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      
      <!-- Producto 1 -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between hover:border-slate-700 transition">
        <div>
          <div class="h-40 bg-slate-950 rounded-xl mb-4 flex items-center justify-center text-amber-500/40">
            <i class="fa-solid fa-jar text-5xl"></i>
          </div>
          <span class="text-[10px] font-bold uppercase text-amber-500 bg-amber-500/10 px-2 py-0.5 rounded">Proteína</span>
          <h3 class="font-bold text-sm mt-2">100% Whey Isolate 1kg</h3>
        </div>
        <div class="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center">
          <span class="font-black text-lg">$48.000</span>
          <button onclick="addToCart('100% Whey Isolate 1kg', 48000)" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-lg transition active:scale-95">Agregar</button>
        </div>
      </div>

      <!-- Producto 2 -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between hover:border-slate-700 transition">
        <div>
          <div class="h-40 bg-slate-950 rounded-xl mb-4 flex items-center justify-center text-amber-500/40">
            <i class="fa-solid fa-bolt text-5xl"></i>
          </div>
          <span class="text-[10px] font-bold uppercase text-amber-500 bg-amber-500/10 px-2 py-0.5 rounded">Rendimiento</span>
          <h3 class="font-bold text-sm mt-2">Creatina Monohidratada 300g</h3>
        </div>
        <div class="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center">
          <span class="font-black text-lg">$38.500</span>
          <button onclick="addToCart('Creatina Monohidratada 300g', 38500)" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-lg transition active:scale-95">Agregar</button>
        </div>
      </div>

      <!-- Producto 3 -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between hover:border-slate-700 transition">
        <div>
          <div class="h-40 bg-slate-950 rounded-xl mb-4 flex items-center justify-center text-amber-500/40">
            <i class="fa-solid fa-fire text-5xl"></i>
          </div>
          <span class="text-[10px] font-bold uppercase text-amber-500 bg-amber-500/10 px-2 py-0.5 rounded">Pre-Entreno</span>
          <h3 class="font-bold text-sm mt-2">Pre-Workout Extreme 30 serv</h3>
        </div>
        <div class="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center">
          <span class="font-black text-lg">$29.000</span>
          <button onclick="addToCart('Pre-Workout Extreme 30 serv', 29000)" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-lg transition active:scale-95">Agregar</button>
        </div>
      </div>

      <!-- Producto 4 -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between hover:border-slate-700 transition">
        <div>
          <div class="h-40 bg-slate-950 rounded-xl mb-4 flex items-center justify-center text-amber-500/40">
            <i class="fa-solid fa-capsules text-5xl"></i>
          </div>
          <span class="text-[10px] font-bold uppercase text-amber-500 bg-amber-500/10 px-2 py-0.5 rounded">Salud</span>
          <h3 class="font-bold text-sm mt-2">Multivitamínico Sports 90 caps</h3>
        </div>
        <div class="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center">
          <span class="font-black text-lg">$18.200</span>
          <button onclick="addToCart('Multivitamínico Sports 90 caps', 18200)" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-lg transition active:scale-95">Agregar</button>
        </div>
      </div>

    </div>
  </main>

  <!-- Panel Lateral Carrito (Slide Drawer) -->
  <div id="cartModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 justify-end">
    <div class="bg-slate-900 w-full max-w-md h-full flex flex-col border-l border-slate-800 shadow-2xl">
      
      <div class="p-4 border-b border-slate-800 flex justify-between items-center">
        <h2 class="font-bold text-lg flex items-center gap-2">
          <i class="fa-solid fa-cart-shopping text-amber-500"></i> Tu Carrito
        </h2>
        <button onclick="toggleCart()" class="text-slate-400 hover:text-white p-2">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <!-- Lista de Ítems -->
      <div id="cartItemsList" class="flex-1 p-4 overflow-y-auto space-y-3">
        <p class="text-xs text-slate-500 text-center py-8">Tu carrito está vacío</p>
      </div>

      <!-- Footer Resumen -->
      <div class="p-4 bg-slate-950 border-t border-slate-800 space-y-3">
        <div class="flex justify-between font-bold text-lg text-white">
          <span>Total:</span>
          <span id="cartTotal" class="text-amber-500">$0</span>
        </div>
        
        <button onclick="checkout()" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold rounded-xl transition shadow-lg shadow-amber-500/10">
          Finalizar Compra
        </button>
      </div>

    </div>
  </div>

  <script>
    let cart = [];

    function toggleCart() {
      const modal = document.getElementById('cartModal');
      modal.classList.toggle('hidden');
      modal.classList.toggle('flex');
    }

    function addToCart(name, price) {
      const item = cart.find(i => i.name === name);
      if (item) {
        item.qty++;
      } else {
        cart.push({ name, price, qty: 1 });
      }
      updateCartUI();
    }

    function changeQty(index, delta) {
      cart[index].qty += delta;
      if (cart[index].qty <= 0) {
        cart.splice(index, 1);
      }
      updateCartUI();
    }

    function updateCartUI() {
      const list = document.getElementById('cartItemsList');
      const badge = document.getElementById('cartBadge');
      const totalEl = document.getElementById('cartTotal');

      const totalItems = cart.reduce((acc, item) => acc + item.qty, 0);
      const totalCost = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);

      badge.textContent = totalItems;
      totalEl.textContent = `$${totalCost.toLocaleString('es-AR')}`;

      if (cart.length === 0) {
        list.innerHTML = '<p class="text-xs text-slate-500 text-center py-8">Tu carrito está vacío</p>';
        return;
      }

      list.innerHTML = cart.map((item, i) => `
        <div class="flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs">
          <div>
            <p class="font-bold text-slate-200">${item.name}</p>
            <p class="text-amber-500 font-semibold mt-0.5">$${item.price.toLocaleString('es-AR')}</p>
          </div>
          <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 rounded-lg p-1">
            <button onclick="changeQty(${i}, -1)" class="w-6 h-6 flex items-center justify-center text-slate-400 hover:text-white font-bold">-</button>
            <span class="font-bold px-1">${item.qty}</span>
            <button onclick="changeQty(${i}, 1)" class="w-6 h-6 flex items-center justify-center text-slate-400 hover:text-white font-bold">+</button>
          </div>
        </div>
      `).join('');
    }

    function checkout() {
      if (cart.length === 0) return alert('El carrito está vacío.');
      alert('¡Gracias por tu compra! Redirigiendo a la pasarela de pago...');
      cart = [];
      updateCartUI();
      toggleCart();
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epic Nutrition Store ARS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center gap-4">
      <h1 class="text-2xl font-black text-amber-500">EPIC<span class="text-white">STORE</span></h1>
      <button class="relative p-2 text-slate-300">
        <i class="fa-solid fa-cart-shopping text-xl"></i>
        <span id="cartBadge" class="absolute -top-1 -right-1 bg-amber-500 text-slate-950 text-[10px] font-black w-4 h-4 rounded-full flex items-center justify-center">0</span>
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <div class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Producto 1 -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between">
        <div>
          <div class="h-40 bg-slate-950 rounded-xl mb-4 flex items-center justify-center text-amber-500/40">
            <i class="fa-solid fa-jar text-5xl"></i>
          </div>
          <span class="text-[10px] font-bold uppercase text-amber-500 bg-amber-500/10 px-2 py-0.5 rounded">Proteína</span>
          <h3 class="font-bold text-sm mt-2">100% Whey Isolate 1kg</h3>
        </div>
        <div class="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center">
          <span class="font-black text-lg">$48.000</span>
          <button onclick="addCart()" class="px-3 py-1.5 bg-amber-500 text-slate-950 font-bold text-xs rounded-lg">Agregar</button>
        </div>
      </div>

      <!-- Producto 2 -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between">
        <div>
          <div class="h-40 bg-slate-950 rounded-xl mb-4 flex items-center justify-center text-amber-500/40">
            <i class="fa-solid fa-bolt text-5xl"></i>
          </div>
          <span class="text-[10px] font-bold uppercase text-amber-500 bg-amber-500/10 px-2 py-0.5 rounded">Rendimiento</span>
          <h3 class="font-bold text-sm mt-2">Creatina Monohidratada 300g</h3>
        </div>
        <div class="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center">
          <span class="font-black text-lg">$38.500</span>
          <button onclick="addCart()" class="px-3 py-1.5 bg-amber-500 text-slate-950 font-bold text-xs rounded-lg">Agregar</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    let count = 0;
    function addCart() {
      count++;
      document.getElementById('cartBadge').textContent = count;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epic Nutrition Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
  <!-- Nav -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center gap-4">
      <h1 class="text-2xl font-black text-amber-500">EPIC<span class="text-white">STORE</span></h1>
      
      <div class="flex-1 max-w-md">
        <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Buscar proteína, creatina, pre-workout..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-xs focus:outline-none focus:border-amber-500">
      </div>

      <button onclick="toggleCartModal()" class="relative p-2 text-slate-300 hover:text-white">
        <i class="fa-solid fa-cart-shopping text-xl"></i>
        <span id="cartBadge" class="absolute -top-1 -right-1 bg-amber-500 text-slate-950 text-[10px] font-black w-4 h-4 rounded-full flex items-center justify-center">0</span>
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <!-- Grid de Productos -->
    <div id="productGrid" class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Producto 1 -->
      <div class="product-card bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between hover:border-slate-700 transition" data-name="whey isolate proteina">
        <div>
          <div class="h-40 bg-slate-950 rounded-xl mb-4 flex items-center justify-center text-slate-700">
            <i class="fa-solid fa-jar text-5xl text-amber-500/40"></i>
          </div>
          <span class="text-[10px] font-bold uppercase text-amber-500 bg-amber-500/10 px-2 py-0.5 rounded">Proteína</span>
          <h3 class="font-bold text-sm mt-2">100% Whey Isolate 2kg</h3>
          <p class="text-xs text-slate-400 mt-1">Aislado de suero de rápida absorción.</p>
        </div>
        <div class="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center">
          <span class="font-black text-lg">$64.99</span>
          <button onclick="addToStoreCart('100% Whey Isolate 2kg', 64.99)" class="px-3 py-1.5 bg-amber-500 text-slate-950 font-bold text-xs rounded-lg hover:bg-amber-400 transition">Agregar</button>
        </div>
      </div>

      <!-- Producto 2 -->
      <div class="product-card bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between hover:border-slate-700 transition" data-name="creatina monohidratada micronizada">
        <div>
          <div class="h-40 bg-slate-950 rounded-xl mb-4 flex items-center justify-center text-slate-700">
            <i class="fa-solid fa-bolt text-5xl text-amber-500/40"></i>
          </div>
          <span class="text-[10px] font-bold uppercase text-amber-500 bg-amber-500/10 px-2 py-0.5 rounded">Rendimiento</span>
          <h3 class="font-bold text-sm mt-2">Creatina Monohidratada 300g</h3>
          <p class="text-xs text-slate-400 mt-1">Aumenta fuerza y potencia muscular.</p>
        </div>
        <div class="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center">
          <span class="font-black text-lg">$29.99</span>
          <button onclick="addToStoreCart('Creatina Monohidratada 300g', 29.99)" class="px-3 py-1.5 bg-amber-500 text-slate-950 font-bold text-xs rounded-lg hover:bg-amber-400 transition">Agregar</button>
        </div>
      </div>

      <!-- Producto 3 -->
      <div class="product-card bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between hover:border-slate-700 transition" data-name="pre workout pre entreno oxido nitrico">
        <div>
          <div class="h-40 bg-slate-950 rounded-xl mb-4 flex items-center justify-center text-slate-700">
            <i class="fa-solid fa-fire text-5xl text-amber-500/40"></i>
          </div>
          <span class="text-[10px] font-bold uppercase text-amber-500 bg-amber-500/10 px-2 py-0.5 rounded">Energía</span>
          <h3 class="font-bold text-sm mt-2">Pre-Workout Nitro Pump</h3>
          <p class="text-xs text-slate-400 mt-1">Enfoque y energía explosiva antes de entrenar.</p>
        </div>
        <div class="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center">
          <span class="font-black text-lg">$34.50</span>
          <button onclick="addToStoreCart('Pre-Workout Nitro Pump', 34.50)" class="px-3 py-1.5 bg-amber-500 text-slate-950 font-bold text-xs rounded-lg hover:bg-amber-400 transition">Agregar</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    let storeCartCount = 0;

    function addToStoreCart(name, price) {
      storeCartCount++;
      document.getElementById('cartBadge').textContent = storeCartCount;
    }

    function filterProducts() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.product-card').forEach(card => {
        const name = card.getAttribute('data-name');
        card.style.display = name.includes(q) ? 'flex' : 'none';
      });
    }
  </script>
</body>
</html>
